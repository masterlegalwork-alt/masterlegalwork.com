name: Monthly technical SEO audit
on:
  push:
    paths:
      - "tools/seo_audit.py"
      - ".github/workflows/seo-monthly-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: '30 1 1 * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/seo_audit.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-technical-seo-audit
          path: |
            reports/seo-monthly.md
            reports/seo-monthly.json
          retention-days: 90
