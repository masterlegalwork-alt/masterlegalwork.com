name: Monthly technical SEO audit
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 1 * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/seo_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-technical-seo-audit
          path: reports/seo-monthly.md
          retention-days: 90
