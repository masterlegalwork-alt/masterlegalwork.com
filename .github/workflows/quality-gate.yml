name: Quality gate
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["updates/**", "pagefind/**"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
jobs:
  links:
    name: Internal links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ${{ github.workspace }} --no-progress --exclude-path pagefind "./**/*.html"
          fail: true
  audit:
    name: Search-engine audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run audit and fail on critical findings
        run: |
          python tools/seo_audit.py --output seo-audit.md || true
          cat seo-audit.md
          if grep -q "^Critical findings: [1-9]" seo-audit.md; then exit 1; fi
  lighthouse:
    name: Lighthouse (performance, accessibility, best practice, SEO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
